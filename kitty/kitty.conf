# ===============================
# Kitty configuration (converted from foot.ini)
# Installing from source via https://sw.kovidgoyal.net/kitty/binary/
# ===============================

# --- Font ---
font_family family="JetBrains Mono"
font_size 10.5
bold_font auto
bold_italic_font auto
italic_font auto

# --- Cursor ---
cursor_shape block
# Fade the cursor in and out instead of a hard on/off blink.
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 10
# Smear the cursor when it jumps more than 2 cells (cursor_trail_start_threshold);
# 3 = ms the cursor must sit still before a trail is drawn.
cursor_trail 3
shell_integration no-cursor

# --- Scrollbar (shown while scrolled back or when hovering the edge) ---
scrollbar scrolled-and-hovered

# --- Mouse ---
# Hide the pointer after 3s without mouse movement (also covers typing).
mouse_hide_wait 3.0

# --- Window ---
hide_window_decorations no
initial_window_height 600
initial_window_width 1000
remember_window_size  no
window_border_width 1.0
window_padding_width 5

# --- Key bindings ---
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# -- Advanced ---
shell zsh
term xterm-256color
